name: Build WF
on:
  pull_request:
    branches: [main]
  
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: run tests on main branch
        run: mvn install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vprofile
          path: target/*.war

      - name: notify if Build fails
        if: failure()
        run: echo "Build Job Failed. Please check the logs for more details."

  Testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code quality
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: run tests on main branch
        run: mvn test

      - name : checkstyles
        run: mvn checkstyle:checkstyle